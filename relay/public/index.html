<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#15212d"><title>ORDO · Контроллер</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b27;color:#f8e8cc;font:16px system-ui,sans-serif;min-height:100dvh;padding:22px;touch-action:manipulation;background-image:repeating-linear-gradient(35deg,#ffffff02 0px,#ffffff02 1px,transparent 1px,transparent 4px)}main{max-width:480px;margin:auto}h1{font-family:Georgia,serif;letter-spacing:8px;font-size:42px;margin:10px 0 2px}small{color:#d6b47d;letter-spacing:2px}p{color:#aebac6;line-height:1.5}input,button{font:inherit;border:2px solid #776952;border-radius:16px;padding:16px;color:inherit;background:#243444;width:100%;margin:8px 0}input{text-transform:uppercase;letter-spacing:5px;font-size:26px;text-align:center}button:active{transform:translateY(2px)}button:disabled{opacity:.4}.primary{background:#397657;border-color:#91ba8a;font-weight:700}#arena{width:100%;aspect-ratio:1;background:#14202c;border-radius:50%;border:2px dashed #a68c66;margin-top:18px;touch-action:none}#pad{display:none}.row{display:flex;gap:12px}.row button{width:50%}#status{min-height:48px;color:#f3ce8a}#health{letter-spacing:5px;color:#65cfff}#choices button{font-size:15px;text-align:left}footer{font-size:12px;color:#81919e;margin-top:18px}#power{accent-color:#60cfff;width:100%;padding:0}label{font-size:13px;color:#b2bdc8}.chip{display:inline-block;padding:6px 14px;border:1px solid #76634d;border-radius:99px;margin-top:12px;color:#e9b865}
</style></head><body><main><small>ХРАНИТЕЛИ ОЧАГА</small><h1>ORDO</h1>
<section id="join"><p>Откройте комнату в игре на телевизоре, введите её код и присоединитесь своим телефоном.</p><input id="code" maxlength="6" placeholder="КОД" aria-label="Код комнаты" autocomplete="off"><button class="primary" id="connect">ПРИСОЕДИНИТЬСЯ</button></section>
<div id="status" role="status" aria-live="polite"></div>
<section id="pad"><div class="chip" id="identity"></div><div id="health"></div><canvas id="arena" width="640" height="640" aria-label="Арена и прицел"></canvas><p id="hint">Проведите от своей фишки в сторону броска.</p><label>СИЛА БРОСКА<input id="power" type="range" min="15" max="100" value="65" aria-label="Сила броска"></label><div class="row"><button id="ability">✦ СПОСОБНОСТЬ</button><button id="ready" class="primary">✓ ГОТОВ</button></div><div id="choices"></div></section>
<footer>Телефон управляет вашей фишкой. Общую сцену смотрите на телевизоре.</footer><script type="module" src="/controller.js"></script></main></body></html>
